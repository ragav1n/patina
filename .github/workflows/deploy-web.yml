name: Deploy web app to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "src/patina/**"
      - "pyproject.toml"
      - "web/**"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3

      - name: Build the patina wheel
        run: uv build --wheel

      - name: Drop the wheel + a manifest into web/pkg
        run: |
          rm -f web/pkg/*.whl
          cp dist/*.whl web/pkg/
          wheel_name=$(basename dist/*.whl)
          printf '{"wheel": "%s"}\n' "$wheel_name" > web/pkg/manifest.json

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - id: deployment
        uses: actions/deploy-pages@v4
